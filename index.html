<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>自訂首頁</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --icon-size: 58px;
      --avatar-size: 100px;
      --grid-cols: 5;
      --grid-max-width: 600px;
      --grid-gap-y: 24px;
      --grid-gap-x: 14px;
      --glass-bg: rgba(24, 28, 38, 0.55);
      --glass-border: rgba(255, 255, 255, 0.14);
      --glass-highlight: inset 0 1px 1px rgba(255, 255, 255, 0.22);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100dvh;
      color: var(--text-main);
      background-color: #000000;
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px 6vh 20px;
      overflow-x: hidden;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .page-wrapper {
      width: 100%;
      max-width: 920px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      gap: 12px;
      margin-bottom: 36px;
      z-index: 30;
      transform: translateY(32px);
      animation: fadeUp 0.5s ease-out;
    }

    .brand-signature {
      font-family: 'Caveat', 'Snell Roundhand', 'Brush Script MT', cursive;
      font-size: clamp(36px, 6vw, 48px);
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #f1f5f9;
      text-shadow: 0 0 18px rgba(196, 181, 253, 0.38), 0 3px 10px rgba(0, 0, 0, 0.85);
      transform: translateY(14px) rotate(-11deg) skewX(-8deg);
      transform-origin: left center;
      user-select: none;
      padding-left: 6px;
      white-space: nowrap;
      flex-shrink: 1;
      min-width: 0;
    }

    main {
      width: 100%;
      max-width: 780px;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 5;
    }

    .top-profile-row {
      position: relative;
      width: 100%;
      max-width: 560px;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      margin-bottom: 28px;
      z-index: 40;
      animation: fadeUp 0.6s ease-out;
    }

    .avatar-container {
      position: relative;
      padding: 0;
      border: none;
      background: transparent;
    }

    .avatar-wrapper {
      position: relative;
      width: var(--avatar-size);
      height: var(--avatar-size);
      border-radius: 50%;
      border: none;
      outline: none;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.65);
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      overflow: hidden;
      background: transparent;
    }

    .avatar-wrapper:active {
      transform: scale(0.93);
    }

    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 50%;
    }

    .menu-wrapper {
      position: absolute;
      right: 4px;
      bottom: 0;
      flex-shrink: 0;
      z-index: 45;
    }

    .hamburger-btn {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(34, 42, 60, 0.88);
      border: 1.5px solid rgba(255, 255, 255, 0.42);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.35), 0 6px 18px rgba(0, 0, 0, 0.72);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4.5px;
      cursor: pointer;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .hamburger-btn:hover {
      background: rgba(48, 58, 82, 0.95);
      border-color: rgba(255, 255, 255, 0.65);
    }

    .hamburger-btn:active {
      transform: scale(0.92);
      background: rgba(65, 78, 108, 0.98);
    }

    .hamburger-line {
      width: 18px;
      height: 2.2px;
      background-color: #ffffff;
      border-radius: 2px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
      transition: transform 0.25s ease, opacity 0.2s ease;
    }

    .menu-wrapper.open .hamburger-line:nth-child(1) {
      transform: translateY(6.7px) rotate(45deg);
    }
    .menu-wrapper.open .hamburger-line:nth-child(2) {
      opacity: 0;
    }
    .menu-wrapper.open .hamburger-line:nth-child(3) {
      transform: translateY(-6.7px) rotate(-45deg);
    }

    .dropdown-menu {
      position: absolute;
      top: 50px;
      right: 0;
      min-width: 164px;
      background: rgba(18, 22, 32, 0.95);
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow: var(--glass-highlight), 0 14px 32px rgba(0, 0, 0, 0.85);
      border-radius: 16px;
      padding: 6px;
      display: none;
      flex-direction: column;
      gap: 4px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      z-index: 50;
    }

    .menu-wrapper.open .dropdown-menu {
      display: flex;
      animation: fadeUp 0.18s ease-out;
    }

    .menu-item-btn {
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 11px;
      font-size: 13.5px;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s ease;
    }

    .menu-item-btn:hover,
    .menu-item-btn:active {
      background: rgba(255, 255, 255, 0.14);
    }

    .search-box {
      width: 100%;
      max-width: 560px;
      height: 50px;
      background: rgba(20, 24, 34, 0.68);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: var(--glass-highlight), 0 12px 32px rgba(0, 0, 0, 0.6);
      border-radius: 25px;
      display: flex;
      align-items: center;
      padding: 0 20px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      margin-bottom: 38px;
      transition: all 0.25s ease;
      animation: fadeUp 0.7s ease-out;
      position: relative;
      z-index: 10;
    }

    .search-box:focus-within {
      border-color: rgba(255, 255, 255, 0.4);
      background: rgba(26, 32, 46, 0.88);
      box-shadow: var(--glass-highlight), 0 14px 36px rgba(0, 0, 0, 0.7), 0 0 0 3px rgba(255, 255, 255, 0.06);
      transform: translateY(-1px);
    }

    .search-icon {
      color: var(--text-sub);
      font-size: 16px;
      margin-right: 12px;
      user-select: none;
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: 15px;
    }

    .search-input::placeholder {
      color: rgba(148, 163, 184, 0.75);
    }

    .search-submit {
      background: transparent;
      border: none;
      color: var(--text-sub);
      font-size: 16px;
      cursor: pointer;
      padding: 4px 6px;
    }

    .shortcuts-grid {
      width: 100%;
      max-width: var(--grid-max-width);
      display: grid;
      grid-template-columns: repeat(var(--grid-cols), minmax(0, 1fr));
      gap: var(--grid-gap-y) var(--grid-gap-x);
      justify-items: center;
      animation: fadeUp 0.8s ease-out;
      transition: max-width 0.25s ease, gap 0.25s ease;
    }

    .shortcut-item {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 96px;
      text-decoration: none;
      color: var(--text-main);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .edit-mode .shortcut-item[data-draggable="true"] {
      cursor: grab;
    }

    .edit-mode .shortcut-item[data-draggable="true"]:active {
      cursor: grabbing;
    }

    .shortcut-item.dragging {
      opacity: 0.5;
      transform: scale(1.06);
      z-index: 20;
    }

    .shortcut-item.drag-over .shortcut-icon {
      outline: 2px dashed #60a5fa;
      outline-offset: 4px;
      transform: scale(1.08);
    }

    .shortcut-icon {
      width: var(--icon-size);
      height: var(--icon-size);
      border-radius: 50%;
      background-color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 9px;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.65);
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), width 0.2s ease, height 0.2s ease;
    }

    .shortcut-item:active .shortcut-icon {
      transform: scale(0.9);
    }

    .shortcut-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
      transition: transform 0.2s ease;
      pointer-events: none;
    }

    .badge-btn {
      position: absolute;
      top: -4px;
      width: 21px;
      height: 21px;
      border-radius: 50%;
      color: #fff;
      font-size: 11px;
      display: none;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
      z-index: 5;
      cursor: pointer;
    }

    .delete-badge {
      right: 4px;
      background: rgba(239, 68, 68, 0.95);
    }

    .edit-badge {
      left: 4px;
      background: rgba(59, 130, 246, 0.95);
    }

    .edit-mode .badge-btn {
      display: flex;
    }

    .edit-banner {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(96, 165, 250, 0.4);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12.5px;
      color: #e2e8f0;
      margin-bottom: 18px;
      backdrop-filter: blur(12px);
    }

    .edit-mode .edit-banner {
      display: flex;
    }

    .edit-done-pill {
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 4px 10px;
      font-size: 12px;
      cursor: pointer;
    }

    .add-btn-circle {
      width: var(--icon-size);
      height: var(--icon-size);
      border-radius: 50%;
      background-color: #000000;
      border: 1.5px dashed rgba(255, 255, 255, 0.34);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 9px;
      color: rgba(255, 255, 255, 0.78);
      font-size: 24px;
      font-weight: 300;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.2s ease, color 0.2s ease;
    }

    .shortcut-item:active .add-btn-circle {
      transform: scale(0.9);
      border-color: rgba(255, 255, 255, 0.65);
      color: #ffffff;
    }

    .shortcut-title {
      font-size: 12px;
      color: rgba(248, 250, 252, 0.9);
      text-align: center;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-card {
      width: 100%;
      max-width: 400px;
      max-height: 90dvh;
      overflow-y: auto;
      background: #121620;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: var(--glass-highlight), 0 24px 48px rgba(0, 0, 0, 0.85);
      border-radius: 20px;
      padding: 24px;
      color: var(--text-main);
    }

    .modal-card h2 {
      font-size: 17px;
      margin-bottom: 18px;
      font-weight: 600;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      color: var(--text-sub);
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      padding: 11px 14px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 14px;
      outline: none;
    }

    .form-input:focus {
      border-color: #60a5fa;
    }

    .grid-setting-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .select-input {
      width: 100%;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(0, 0, 0, 0.65);
      color: #fff;
      font-size: 13.5px;
      outline: none;
    }

    .icon-picker-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon-preview {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #000;
      border: 1px solid rgba(255, 255, 255, 0.2);
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      color: var(--text-sub);
    }

    .icon-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .icon-picker-btns {
      display: flex;
      flex: 1;
      gap: 8px;
    }

    .btn-small {
      flex: 1;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      font-size: 12px;
      cursor: pointer;
    }

    .hint-text {
      font-size: 12px;
      color: var(--text-sub);
      line-height: 1.55;
      margin-bottom: 18px;
    }

    .range-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .range-row input[type="range"] {
      flex: 1;
      accent-color: #60a5fa;
    }

    .radio-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 6px;
    }

    .radio-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      cursor: pointer;
    }

    .btn-row {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .btn {
      padding: 10px 16px;
      border-radius: 12px;
      border: none;
      font-size: 13.5px;
      cursor: pointer;
      font-weight: 500;
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
    }

    .btn-primary {
      background: #3b82f6;
      color: #fff;
    }

    .btn-full {
      width: 100%;
      margin-bottom: 10px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .divider-line {
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
      margin: 16px 0;
    }

    @media (max-width: 600px) {
      body {
        padding: 18px 14px 5vh 14px;
      }
      header {
        margin-bottom: 28px;
      }
      .brand-signature {
        font-size: 34px;
      }
    }
  </style>
</head>
<body>

  <div class="page-wrapper">
    <header>
      <div class="brand-signature">Wei-Fan's homepage</div>
    </header>

    <main>
      <div class="top-profile-row">
        <div class="avatar-container">
          <div class="avatar-wrapper" id="avatarBox" title="點擊更換個人頭像">
            <img id="avatarImg" src="" alt="個人頭像" />
          </div>
        </div>

        <div class="menu-wrapper" id="menuWrapper">
          <button class="hamburger-btn" id="hamburgerBtn" aria-label="開啟選單" title="功能選單">
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
          </button>
          <div class="dropdown-menu" id="dropdownMenu">
            <button class="menu-item-btn" id="settingsBtn">首頁設定</button>
            <button class="menu-item-btn" id="bgBtn">更換背景</button>
            <button class="menu-item-btn" id="toggleAddShortcutBtn">隱藏新增捷徑按鈕</button>
          </div>
        </div>
      </div>

      <form class="search-box" id="searchForm">
        <span class="search-icon">⌕</span>
        <input type="text" class="search-input" id="searchInput" placeholder="搜尋 Google，或輸入關鍵字" autocomplete="off" />
        <button type="submit" class="search-submit">↵</button>
      </form>

      <div class="edit-banner" id="editBanner">
        <span>拖曳圖示可互換位置，或點擊圖示上方按鈕修改／刪除</span>
        <button type="button" class="edit-done-pill" id="bannerDoneBtn">完成</button>
      </div>

      <div class="shortcuts-grid" id="shortcutsGrid"></div>
    </main>
  </div>

  <input type="file" id="bgFileInput" accept="image/*" style="display: none;" />
  <input type="file" id="avatarFileInput" accept="image/*" style="display: none;" />
  <input type="file" id="shortcutIconFileInput" accept="image/*" style="display: none;" />
  <input type="file" id="importJsonFileInput" accept=".json,application/json" style="display: none;" />

  <div class="modal-overlay" id="addModal">
    <div class="modal-card">
      <h2 id="modalTitle">新增圓形捷徑</h2>
      <div class="form-group">
        <label>捷徑名稱</label>
        <input type="text" class="form-input" id="siteNameInput" placeholder="例如：YouTube" />
      </div>
      <div class="form-group">
        <label>網站網址</label>
        <input type="text" class="form-input" id="siteUrlInput" placeholder="例如：https://www.youtube.com" />
      </div>
      <div class="form-group">
        <label>捷徑圖示（可選，預設自動抓取網站高清圖）</label>
        <div class="icon-picker-row">
          <div class="icon-preview" id="iconPreviewBox">自動</div>
          <div class="icon-picker-btns">
            <button type="button" class="btn-small" id="pickShortcutIconBtn">選擇相簿圖片</button>
            <button type="button" class="btn-small" id="resetShortcutIconBtn">恢復自動抓取</button>
          </div>
        </div>
      </div>
      <p class="hint-text">若未自訂圖片，系統會自動抓取網站高解析度圓形圖示，並自動填滿邊緣。</p>
      <div class="btn-row">
        <button class="btn btn-secondary" id="cancelAddBtn">取消</button>
        <button class="btn btn-primary" id="saveAddBtn">儲存捷徑</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="settingsModal">
    <div class="modal-card" id="settingsModalCard">
      <h2>首頁設定</h2>

      <div class="form-group">
        <label>捷徑排列行數與列數（每排欄數 × 顯示列數）</label>
        <div class="grid-setting-row">
          <div>
            <select id="gridColsSelect" class="select-input">
              <option value="3">每排 3 個（3 欄）</option>
              <option value="4">每排 4 個（4 欄）</option>
              <option value="5" selected>每排 5 個（5 欄）</option>
              <option value="6">每排 6 個（6 欄）</option>
              <option value="7">每排 7 個（7 欄）</option>
              <option value="8">每排 8 個（8 欄）</option>
            </select>
          </div>
          <div>
            <select id="gridRowsSelect" class="select-input">
              <option value="0" selected>不限列數（自動換行）</option>
              <option value="1">最多顯示 1 列</option>
              <option value="2">最多顯示 2 列</option>
              <option value="3">最多顯示 3 列</option>
              <option value="4">最多顯示 4 列</option>
            </select>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label>個人頭像設定</label>
        <button class="btn btn-full" id="uploadAvatarBtn">從相簿選擇個人頭像</button>
        <div class="range-row">
          <span style="font-size:12px;">小</span>
          <input type="range" id="avatarSizeRange" min="64" max="140" value="100" />
          <span style="font-size:12px;">大</span>
        </div>
      </div>

      <div class="form-group">
        <label>所有捷徑圖示大小：<span id="iconSizeLabel">58</span> px</label>
        <div class="range-row">
          <span style="font-size:12px;">小</span>
          <input type="range" id="iconSizeRange" min="40" max="84" value="58" />
          <span style="font-size:12px;">大</span>
        </div>
      </div>

      <div class="form-group">
        <label>背景圖片顯示方式</label>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="bgFit" value="cover" checked />
            填滿畫面（建議，會依螢幕橫／直向裁切）
          </label>
          <label class="radio-label">
            <input type="radio" name="bgFit" value="contain" />
            完整顯示（可能留黑邊）
          </label>
        </div>
      </div>

      <button class="btn btn-full" id="resetBgBtn">恢復純黑極簡背景</button>

      <div class="divider-line"></div>

      <div class="form-group">
        <label>匯出 / 匯入記憶（完整備份捷徑、頭像與背景設定）</label>
        <div class="grid-setting-row">
          <button type="button" class="btn btn-full" id="exportDataBtn" style="margin-bottom:0;">匯出設定檔</button>
          <button type="button" class="btn btn-full" id="importDataBtn" style="margin-bottom:0;">匯入設定檔</button>
        </div>
      </div>

      <div class="btn-row">
        <button class="btn btn-primary" id="closeSettingsBtn" style="width:100%;">完成</button>
      </div>
    </div>
  </div>

  <script>
    const defaultAvatarSvg = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(
      "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='#111622'/><circle cx='50' cy='38' r='16' fill='#64748b'/><path d='M22 84 C22 64, 78 64, 78 84' fill='#64748b'/></svg>"
    );

    const STORAGE_KEY = 'sual_shortcuts_v3_clean';
    let shortcuts = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    let isEditMode = false;
    let editingIndex = -1;
    let tempCustomIcon = '';
    let dragSrcIndex = null;
    let gridCols = parseInt(localStorage.getItem('sual_grid_cols')) || 5;
    let gridRows = parseInt(localStorage.getItem('sual_grid_rows')) || 0;
    let showAddShortcut = localStorage.getItem('sual_show_add_shortcut') !== 'false';

    const grid = document.getElementById('shortcutsGrid');
    const toggleAddShortcutBtn = document.getElementById('toggleAddShortcutBtn');
    const menuWrapper = document.getElementById('menuWrapper');
    const hamburgerBtn = document.getElementById('hamburgerBtn');

    hamburgerBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      menuWrapper.classList.toggle('open');
    });

    document.addEventListener('click', (e) => {
      if (!menuWrapper.contains(e.target)) {
        menuWrapper.classList.remove('open');
      }
    });

    function applyGridLayout() {
      const screenWidth = window.innerWidth;
      const isPortrait = screenWidth < 600;
      const effectiveCols = isPortrait && gridCols > 5 ? 5 : gridCols;

      const baseIconSize = parseInt(localStorage.getItem('sual_icon_size')) || 58;
      const availableWidth = Math.min(screenWidth - 32, 740);
      const cellWidth = availableWidth / effectiveCols;

      const maxAllowedIcon = Math.max(36, Math.floor(cellWidth * 0.68));
      const computedIconSize = Math.min(baseIconSize, maxAllowedIcon);

      const gapX = effectiveCols >= 7 ? 8 : (effectiveCols >= 5 ? 14 : 20);
      const gapY = gridRows >= 3 ? 18 : 24;
      const maxWidth = Math.min(760, effectiveCols * 112);

      document.documentElement.style.setProperty('--grid-cols', effectiveCols);
      document.documentElement.style.setProperty('--grid-max-width', maxWidth + 'px');
      document.documentElement.style.setProperty('--grid-gap-x', gapX + 'px');
      document.documentElement.style.setProperty('--grid-gap-y', gapY + 'px');
      document.documentElement.style.setProperty('--icon-size', computedIconSize + 'px');
    }

    window.addEventListener('resize', () => {
      applyGridLayout();
    });

    function getHighResIcon(url) {
      try {
        const domain = new URL(url).hostname;
        return `https://icon.horse/icon/${domain}`;
      } catch (e) {
        return '';
      }
    }

    function autoFitIcon(img) {
      try {
        const canvas = document.createElement('canvas');
        const size = 64;
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, size, size);
        const cornerAlpha = ctx.getImageData(2, 2, 1, 1).data[3];
        const edgeAlpha = ctx.getImageData(32, 3, 1, 1).data[3];
        if (cornerAlpha < 50 && edgeAlpha < 50) {
          img.style.transform = 'scale(1.22)';
        }
      } catch (e) {
        img.style.transform = 'scale(1.06)';
      }
    }

    function swapShortcuts(fromIndex, toIndex) {
      if (fromIndex === null || toIndex === null || fromIndex === toIndex) return;
      if (fromIndex < 0 || toIndex < 0 || fromIndex >= shortcuts.length || toIndex >= shortcuts.length) return;
      const temp = shortcuts[fromIndex];
      shortcuts[fromIndex] = shortcuts[toIndex];
      shortcuts[toIndex] = temp;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(shortcuts));
      renderShortcuts();
    }

    function setEditMode(state) {
      if (isEditMode === state) return;
      isEditMode = state;
      document.body.classList.toggle('edit-mode', isEditMode);
      renderShortcuts();
    }

    function renderShortcuts() {
      grid.innerHTML = '';

      const screenWidth = window.innerWidth;
      const effectiveCols = (screenWidth < 600 && gridCols > 5) ? 5 : gridCols;
      const maxSlots = (!isEditMode && gridRows > 0) ? (effectiveCols * gridRows) : Infinity;

      const visibleShortcuts = (!isEditMode && maxSlots < Infinity)
        ? shortcuts.slice(0, Math.max(0, maxSlots - (showAddShortcut ? 1 : 0)))
        : shortcuts;

      visibleShortcuts.forEach((item, index) => {
        const a = document.createElement('a');
        a.className = 'shortcut-item';
        a.href = isEditMode ? 'javascript:void(0)' : item.url;
        a.dataset.index = index;
        a.dataset.draggable = 'true';
        if (isEditMode) {
          a.setAttribute('draggable', 'true');
        }

        let domain = '';
        try { domain = new URL(item.url).hostname; } catch (e) {}
        const fallbackUrl = `https://www.google.com/s2/favicons?domain=${domain}&sz=256`;
        const iconSrc = item.customIcon ? item.customIcon : getHighResIcon(item.url);

        a.innerHTML = `
          <div class="badge-btn edit-badge" title="編輯">✎</div>
          <div class="badge-btn delete-badge" title="刪除">✕</div>
          <div class="shortcut-icon">
            <img src="${iconSrc}" crossorigin="anonymous" alt="${item.name}" />
          </div>
          <span class="shortcut-title">${item.name}</span>
        `;

        const imgEl = a.querySelector('img');
        imgEl.onload = () => {
          if (!item.customIcon) autoFitIcon(imgEl);
        };
        imgEl.onerror = () => {
          imgEl.onerror = null;
          imgEl.src = fallbackUrl;
        };

        a.querySelector('.delete-badge').addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          shortcuts.splice(index, 1);
          localStorage.setItem(STORAGE_KEY, JSON.stringify(shortcuts));
          renderShortcuts();
        });

        a.querySelector('.edit-badge').addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          openShortcutModal(index);
        });

        let pressTimer = null;
        let startX = 0;
        let startY = 0;
        let suppressClick = false;
        let isTouchDragging = false;

        a.addEventListener('mousedown', (e) => {
          if (e.button !== 0 || isEditMode) return;
          if (e.target.classList.contains('badge-btn')) return;
          startX = e.clientX;
          startY = e.clientY;
          suppressClick = false;
          pressTimer = setTimeout(() => {
            suppressClick = true;
            setEditMode(true);
          }, 420);
        });

        a.addEventListener('mousemove', (e) => {
          if (!pressTimer) return;
          if (Math.abs(e.clientX - startX) > 8 || Math.abs(e.clientY - startY) > 8) {
            clearTimeout(pressTimer);
            pressTimer = null;
          }
        });

        a.addEventListener('mouseup', () => {
          clearTimeout(pressTimer);
          pressTimer = null;
        });

        a.addEventListener('mouseleave', () => {
          clearTimeout(pressTimer);
          pressTimer = null;
        });

        a.addEventListener('dragstart', (e) => {
          if (!isEditMode) {
            e.preventDefault();
            return;
          }
          dragSrcIndex = index;
          a.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
        });

        a.addEventListener('dragover', (e) => {
          if (!isEditMode) return;
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          a.classList.add('drag-over');
        });

        a.addEventListener('dragleave', () => {
          a.classList.remove('drag-over');
        });

        a.addEventListener('drop', (e) => {
          if (!isEditMode) return;
          e.preventDefault();
          a.classList.remove('drag-over');
          swapShortcuts(dragSrcIndex, index);
          dragSrcIndex = null;
        });

        a.addEventListener('dragend', () => {
          a.classList.remove('dragging');
          document.querySelectorAll('.shortcut-item').forEach(el => el.classList.remove('drag-over'));
        });

        a.addEventListener('touchstart', (e) => {
          if (e.target.classList.contains('badge-btn')) return;
          const touch = e.touches[0];
          startX = touch.clientX;
          startY = touch.clientY;
          suppressClick = false;

          if (isEditMode) {
            isTouchDragging = true;
            a.classList.add('dragging');
          } else {
            isTouchDragging = false;
            pressTimer = setTimeout(() => {
              suppressClick = true;
              if (navigator.vibrate) navigator.vibrate(25);
              setEditMode(true);
            }, 400);
          }
        }, { passive: true });

        a.addEventListener('touchmove', (e) => {
          const touch = e.touches[0];
          if (!isEditMode) {
            if (Math.abs(touch.clientX - startX) > 10 || Math.abs(touch.clientY - startY) > 10) {
              clearTimeout(pressTimer);
              pressTimer = null;
            }
            return;
          }

          if (!isTouchDragging) return;
          e.preventDefault();
          const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
          const targetItem = targetEl ? targetEl.closest('.shortcut-item[data-draggable="true"]') : null;
          document.querySelectorAll('.shortcut-item').forEach(el => el.classList.remove('drag-over'));
          if (targetItem && parseInt(targetItem.dataset.index) !== index) {
            targetItem.classList.add('drag-over');
          }
        }, { passive: false });

        a.addEventListener('touchend', (e) => {
          clearTimeout(pressTimer);
          pressTimer = null;
          if (!isTouchDragging) return;

          const touch = e.changedTouches[0];
          const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
          const targetItem = targetEl ? targetEl.closest('.shortcut-item[data-draggable="true"]') : null;
          a.classList.remove('dragging');
          document.querySelectorAll('.shortcut-item').forEach(el => el.classList.remove('drag-over'));

          if (targetItem) {
            const targetIndex = parseInt(targetItem.dataset.index);
            swapShortcuts(index, targetIndex);
          }
          isTouchDragging = false;
        });

        a.addEventListener('touchcancel', () => {
          clearTimeout(pressTimer);
          pressTimer = null;
          isTouchDragging = false;
          a.classList.remove('dragging');
          document.querySelectorAll('.shortcut-item').forEach(el => el.classList.remove('drag-over'));
        });

        a.addEventListener('contextmenu', (e) => {
          e.preventDefault();
        });

        a.addEventListener('click', (e) => {
          if (suppressClick || isEditMode) {
            e.preventDefault();
            suppressClick = false;
          }
        });

        grid.appendChild(a);
      });

      if (showAddShortcut) {
        const addBtn = document.createElement('div');
        addBtn.className = 'shortcut-item';
        addBtn.innerHTML = `
          <div class="add-btn-circle">+</div>
          <span class="shortcut-title">新增捷徑</span>
        `;
        addBtn.addEventListener('click', () => openShortcutModal(-1));
        grid.appendChild(addBtn);
      }
    }

    function updateIconPreview(src) {
      const box = document.getElementById('iconPreviewBox');
      if (src) {
        box.innerHTML = `<img src="${src}" alt="預覽" />`;
      } else {
        box.innerHTML = '自動';
      }
    }

    function openShortcutModal(index) {
      editingIndex = index;
      const modalTitle = document.getElementById('modalTitle');
      const nameInput = document.getElementById('siteNameInput');
      const urlInput = document.getElementById('siteUrlInput');

      if (index >= 0) {
        modalTitle.textContent = '編輯捷徑';
        nameInput.value = shortcuts[index].name;
        urlInput.value = shortcuts[index].url;
        tempCustomIcon = shortcuts[index].customIcon || '';
      } else {
        modalTitle.textContent = '新增圓形捷徑';
        nameInput.value = '';
        urlInput.value = '';
        tempCustomIcon = '';
      }

      updateIconPreview(tempCustomIcon);
      document.getElementById('addModal').classList.add('active');
    }

    const shortcutIconFileInput = document.getElementById('shortcutIconFileInput');
    document.getElementById('pickShortcutIconBtn').addEventListener('click', () => shortcutIconFileInput.click());
    document.getElementById('resetShortcutIconBtn').addEventListener('click', () => {
      tempCustomIcon = '';
      updateIconPreview('');
    });

    shortcutIconFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      compressImage(file, 256, 0.9, true, (dataUrl) => {
        tempCustomIcon = dataUrl;
        updateIconPreview(dataUrl);
      });
      e.target.value = '';
    });

    document.getElementById('searchForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const q = document.getElementById('searchInput').value.trim();
      if (!q) return;
      if (/^(http:\/\/|https:\/\/)/i.test(q)) {
        window.location.href = q;
      } else if (/^[a-zA-Z0-9-]+\.[a-zA-Z]{2,}/.test(q)) {
        window.location.href = 'https://' + q;
      } else {
        window.location.href = `https://www.google.com/search?q=${encodeURIComponent(q)}`;
      }
    });

    const bannerDoneBtn = document.getElementById('bannerDoneBtn');
    bannerDoneBtn.addEventListener('click', () => {
      setEditMode(false);
    });

    function updateAddShortcutToggleLabel() {
      toggleAddShortcutBtn.textContent = showAddShortcut
        ? '隱藏新增捷徑按鈕'
        : '顯示新增捷徑按鈕';
    }

    toggleAddShortcutBtn.addEventListener('click', () => {
      showAddShortcut = !showAddShortcut;
      localStorage.setItem('sual_show_add_shortcut', String(showAddShortcut));
      updateAddShortcutToggleLabel();
      menuWrapper.classList.remove('open');
      renderShortcuts();
    });

    document.getElementById('cancelAddBtn').addEventListener('click', () => {
      document.getElementById('addModal').classList.remove('active');
    });

    document.getElementById('saveAddBtn').addEventListener('click', () => {
      const name = document.getElementById('siteNameInput').value.trim();
      let url = document.getElementById('siteUrlInput').value.trim();
      if (!name || !url) return alert('請輸入名稱與網址');
      if (!/^https?:\/\//i.test(url)) url = 'https://' + url;

      const dataObj = { name, url, customIcon: tempCustomIcon };
      if (editingIndex >= 0) {
        shortcuts[editingIndex] = dataObj;
      } else {
        shortcuts.push(dataObj);
      }

      localStorage.setItem(STORAGE_KEY, JSON.stringify(shortcuts));
      document.getElementById('addModal').classList.remove('active');
      renderShortcuts();
    });

    function compressImage(file, maxWidth, quality, keepPng, callback) {
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let width = img.width;
          let height = img.height;
          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }
          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);
          const mime = (keepPng && file.type === 'image/png') ? 'image/png' : 'image/jpeg';
          callback(canvas.toDataURL(mime, quality));
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    const avatarFileInput = document.getElementById('avatarFileInput');
    const avatarImg = document.getElementById('avatarImg');

    function triggerAvatarUpload() {
      avatarFileInput.click();
    }

    document.getElementById('avatarBox').addEventListener('click', triggerAvatarUpload);
    document.getElementById('uploadAvatarBtn').addEventListener('click', triggerAvatarUpload);

    avatarFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      compressImage(file, 400, 0.88, false, (compressedDataUrl) => {
        avatarImg.src = compressedDataUrl;
        localStorage.setItem('sual_avatar', compressedDataUrl);
      });
      e.target.value = '';
    });

    const bgFileInput = document.getElementById('bgFileInput');
    document.getElementById('bgBtn').addEventListener('click', () => {
      menuWrapper.classList.remove('open');
      bgFileInput.click();
    });

    bgFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      compressImage(file, 1600, 0.85, false, (compressedDataUrl) => {
        document.body.style.backgroundImage = `url('${compressedDataUrl}')`;
        try {
          localStorage.setItem('sual_bg', compressedDataUrl);
        } catch (err) {
          alert('圖片檔案過大，已為您暫時套用，但重開瀏覽器可能不會保留。');
        }
      });
      e.target.value = '';
    });

    const settingsModal = document.getElementById('settingsModal');

    document.getElementById('settingsBtn').addEventListener('click', () => {
      menuWrapper.classList.remove('open');
      settingsModal.classList.add('active');
    });

    document.getElementById('closeSettingsBtn').addEventListener('click', () => settingsModal.classList.remove('active'));

    document.querySelectorAll('.modal-overlay').forEach(overlay => {
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) overlay.classList.remove('active');
      });
    });

    document.getElementById('exportDataBtn').addEventListener('click', () => {
      const backupObj = {};
      for (let i = 0; i < localStorage.length; i++) {
        const key = localStorage.key(i);
        backupObj[key] = localStorage.getItem(key);
      }
      const jsonStr = JSON.stringify(backupObj, null, 2);
      const blob = new Blob([jsonStr], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const dateStr = new Date().toISOString().slice(0, 10);
      a.href = url;
      a.download = `homepage_backup_${dateStr}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });

    const importJsonFileInput = document.getElementById('importJsonFileInput');
    document.getElementById('importDataBtn').addEventListener('click', () => {
      importJsonFileInput.click();
    });

    importJsonFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const data = JSON.parse(ev.target.result);
          if (typeof data !== 'object' || data === null) {
            throw new Error('格式錯誤');
          }
          Object.keys(data).forEach((k) => {
            localStorage.setItem(k, data[k]);
          });
          alert('記憶匯入成功，即將重新載入首頁！');
          location.reload();
        } catch (err) {
          alert('匯入失敗：檔案格式不正確或已損毀。');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    });

    const gridColsSelect = document.getElementById('gridColsSelect');
    const gridRowsSelect = document.getElementById('gridRowsSelect');

    gridColsSelect.addEventListener('change', (e) => {
      gridCols = parseInt(e.target.value);
      localStorage.setItem('sual_grid_cols', gridCols);
      applyGridLayout();
      renderShortcuts();
    });

    gridRowsSelect.addEventListener('change', (e) => {
      gridRows = parseInt(e.target.value);
      localStorage.setItem('sual_grid_rows', gridRows);
      applyGridLayout();
      renderShortcuts();
    });

    const iconSizeRange = document.getElementById('iconSizeRange');
    const iconSizeLabel = document.getElementById('iconSizeLabel');
    iconSizeRange.addEventListener('input', (e) => {
      const val = e.target.value;
      iconSizeLabel.textContent = val;
      localStorage.setItem('sual_icon_size', val);
      applyGridLayout();
    });

    const avatarSizeRange = document.getElementById('avatarSizeRange');
    avatarSizeRange.addEventListener('input', (e) => {
      const val = e.target.value;
      document.documentElement.style.setProperty('--avatar-size', val + 'px');
      localStorage.setItem('sual_avatar_size', val);
    });

    document.querySelectorAll('input[name="bgFit"]').forEach((radio) => {
      radio.addEventListener('change', (e) => {
        document.body.style.backgroundSize = e.target.value;
        localStorage.setItem('sual_bg_fit', e.target.value);
      });
    });

    document.getElementById('resetBgBtn').addEventListener('click', () => {
      localStorage.removeItem('sual_bg');
      document.body.style.backgroundImage = 'none';
      document.body.style.backgroundColor = '#000000';
    });

    function initSettings() {
      localStorage.removeItem('sual_shortcuts_v2');

      const savedAvatar = localStorage.getItem('sual_avatar');
      avatarImg.src = savedAvatar || defaultAvatarSvg;

      const savedBg = localStorage.getItem('sual_bg');
      if (savedBg) {
        document.body.style.backgroundImage = `url('${savedBg}')`;
      } else {
        document.body.style.backgroundImage = 'none';
        document.body.style.backgroundColor = '#000000';
      }

      const savedIconSize = localStorage.getItem('sual_icon_size');
      if (savedIconSize) {
        iconSizeRange.value = savedIconSize;
        iconSizeLabel.textContent = savedIconSize;
      }

      const savedAvatarSize = localStorage.getItem('sual_avatar_size');
      if (savedAvatarSize) {
        avatarSizeRange.value = savedAvatarSize;
        document.documentElement.style.setProperty('--avatar-size', savedAvatarSize + 'px');
      }

      const savedBgFit = localStorage.getItem('sual_bg_fit');
      if (savedBgFit) {
        document.body.style.backgroundSize = savedBgFit;
        const radio = document.querySelector(`input[name="bgFit"][value="${savedBgFit}"]`);
        if (radio) radio.checked = true;
      }

      gridCols = parseInt(localStorage.getItem('sual_grid_cols')) || 5;
      gridRows = parseInt(localStorage.getItem('sual_grid_rows')) || 0;
      showAddShortcut = localStorage.getItem('sual_show_add_shortcut') !== 'false';
      shortcuts = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

      gridColsSelect.value = String(gridCols);
      gridRowsSelect.value = String(gridRows);
      updateAddShortcutToggleLabel();

      applyGridLayout();
      renderShortcuts();
    }

    initSettings();
  </script>
</body>
</html>
