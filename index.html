<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>自訂首頁</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --icon-size: 58px;
      --shortcut-font-size: 12px;
      --avatar-size: 100px;
      --grid-cols: 5;
      --grid-gap-y: 24px;
      --grid-gap-x: 14px;
      --ui-scale: 1;
      --wrapper-max-width: 920px;
      --content-max-width: 560px;
      --grid-max-width: 600px;
      --glass-highlight: inset 0 1px 1px rgba(255, 255, 255, 0.22);
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    }

    body {
      min-height: 100dvh;
      color: var(--text-main);
      background-color: #000000;
      background-size: cover;
      background-position: center center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: calc(22px * var(--ui-scale)) 16px calc(6vh * var(--ui-scale));
      overflow-x: hidden;
      position: relative;
      font-size: calc(14px * var(--ui-scale));
    }

    /* 柔和暗化遮罩（不阻擋任何點擊互動） */
    .brightness-overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
      background-color: rgba(0, 0, 0, 0);
      transition: background-color 0.16s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .page-wrapper {
      width: 100%;
      max-width: var(--wrapper-max-width);
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      z-index: 4;
      transition: max-width 0.22s ease, filter 0.16s ease;
    }

    header {
      width: 100%;
      display: flex;
      justify-content: flex-start;
      align-items: center;
      margin-bottom: calc(34px * var(--ui-scale));
      z-index: 30;
      transform: translateY(calc(28px * var(--ui-scale)));
      animation: fadeUp 0.5s ease-out;
    }

    .brand-signature {
      font-family: 'Caveat', 'Snell Roundhand', 'Brush Script MT', cursive;
      font-size: calc(clamp(32px, 5.5vw, 46px) * var(--ui-scale));
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #f1f5f9;
      text-shadow: 0 0 18px rgba(196, 181, 253, 0.38), 0 3px 10px rgba(0, 0, 0, 0.85);
      transform: translateY(calc(12px * var(--ui-scale))) rotate(-11deg) skewX(-8deg);
      transform-origin: left center;
      user-select: none;
      padding-left: 6px;
      white-space: nowrap;
      max-width: 92vw;
    }

    main {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 5;
    }

    .top-profile-row {
      position: relative;
      width: 100%;
      max-width: var(--content-max-width);
      display: flex;
      justify-content: center;
      align-items: flex-end;
      margin-bottom: calc(26px * var(--ui-scale));
      z-index: 40;
      animation: fadeUp 0.6s ease-out;
      transition: max-width 0.22s ease;
    }

    .avatar-wrapper {
      position: relative;
      width: calc(var(--avatar-size) * var(--ui-scale));
      height: calc(var(--avatar-size) * var(--ui-scale));
      border-radius: 50%;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.65);
      cursor: pointer;
      transition: transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1), width 0.2s ease, height 0.2s ease;
      overflow: hidden;
    }

    .avatar-wrapper:active {
      transform: scale(0.93);
    }

    .avatar-wrapper img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      border-radius: 50%;
    }

    .menu-wrapper {
      position: absolute;
      right: 4px;
      bottom: 0;
      z-index: 45;
    }

    .hamburger-btn {
      width: calc(42px * var(--ui-scale));
      height: calc(42px * var(--ui-scale));
      border-radius: 50%;
      background: rgba(34, 42, 60, 0.88);
      border: 1.5px solid rgba(255, 255, 255, 0.42);
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.35), 0 6px 18px rgba(0, 0, 0, 0.72);
      color: #ffffff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: calc(4.5px * var(--ui-scale));
      cursor: pointer;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      transition: transform 0.2s ease, background 0.2s ease, border-color 0.2s ease;
    }

    .hamburger-btn:hover {
      background: rgba(48, 58, 82, 0.95);
      border-color: rgba(255, 255, 255, 0.65);
    }

    .hamburger-btn:active {
      transform: scale(0.92);
    }

    .hamburger-line {
      width: calc(18px * var(--ui-scale));
      height: calc(2.2px * var(--ui-scale));
      background-color: #ffffff;
      border-radius: 2px;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.45);
      transition: transform 0.25s ease, opacity 0.2s ease;
    }

    .menu-wrapper.open .hamburger-line:nth-child(1) {
      transform: translateY(calc(6.7px * var(--ui-scale))) rotate(45deg);
    }
    .menu-wrapper.open .hamburger-line:nth-child(2) {
      opacity: 0;
    }
    .menu-wrapper.open .hamburger-line:nth-child(3) {
      transform: translateY(calc(-6.7px * var(--ui-scale))) rotate(-45deg);
    }

    .dropdown-menu {
      position: absolute;
      top: calc(50px * var(--ui-scale));
      right: 0;
      min-width: 164px;
      background: rgba(18, 22, 32, 0.96);
      border: 1px solid rgba(255, 255, 255, 0.22);
      box-shadow: var(--glass-highlight), 0 14px 32px rgba(0, 0, 0, 0.85);
      border-radius: 16px;
      padding: 6px;
      display: none;
      flex-direction: column;
      gap: 4px;
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      z-index: 50;
    }

    .menu-wrapper.open .dropdown-menu {
      display: flex;
      animation: fadeUp 0.18s ease-out;
    }

    .menu-item-btn {
      width: 100%;
      text-align: left;
      background: transparent;
      border: none;
      color: var(--text-main);
      padding: 10px 14px;
      border-radius: 11px;
      font-size: calc(13.5px * var(--ui-scale));
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s ease;
    }

    .menu-item-btn:hover,
    .menu-item-btn:active {
      background: rgba(255, 255, 255, 0.14);
    }

    .search-box {
      width: 100%;
      max-width: var(--content-max-width);
      height: calc(50px * var(--ui-scale));
      background: rgba(20, 24, 34, 0.68);
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: var(--glass-highlight), 0 12px 32px rgba(0, 0, 0, 0.6);
      border-radius: calc(25px * var(--ui-scale));
      display: flex;
      align-items: center;
      padding: 0 calc(18px * var(--ui-scale));
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      margin-bottom: calc(36px * var(--ui-scale));
      transition: border-color 0.2s ease, background 0.2s ease, max-width 0.22s ease;
      animation: fadeUp 0.7s ease-out;
      position: relative;
      z-index: 10;
    }

    .search-box:focus-within {
      border-color: rgba(255, 255, 255, 0.4);
      background: rgba(26, 32, 46, 0.88);
      box-shadow: var(--glass-highlight), 0 14px 36px rgba(0, 0, 0, 0.7), 0 0 0 3px rgba(255, 255, 255, 0.06);
    }

    .search-icon {
      color: var(--text-sub);
      font-size: calc(16px * var(--ui-scale));
      margin-right: calc(12px * var(--ui-scale));
      user-select: none;
    }

    .search-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-size: calc(15px * var(--ui-scale));
      min-width: 0;
    }

    .search-input::placeholder {
      color: rgba(148, 163, 184, 0.75);
    }

    .search-submit {
      background: transparent;
      border: none;
      color: var(--text-sub);
      font-size: calc(16px * var(--ui-scale));
      cursor: pointer;
      padding: 4px 6px;
    }

    .shortcuts-grid {
      width: 100%;
      max-width: var(--grid-max-width);
      display: grid;
      grid-template-columns: repeat(var(--grid-cols), minmax(0, 1fr));
      gap: calc(var(--grid-gap-y) * var(--ui-scale)) calc(var(--grid-gap-x) * var(--ui-scale));
      justify-items: center;
      animation: fadeUp 0.8s ease-out;
      transition: max-width 0.22s ease, gap 0.22s ease;
    }

    .shortcut-item {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: calc(96px * var(--ui-scale));
      text-decoration: none;
      color: var(--text-main);
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      transition: transform 0.2s ease, opacity 0.2s ease;
    }

    .edit-mode .shortcut-item[data-draggable="true"] {
      cursor: grab;
    }

    .shortcut-item.dragging {
      opacity: 0.48;
      transform: scale(1.06);
      z-index: 20;
    }

    .shortcut-item.drag-over .shortcut-icon {
      outline: 2px dashed #60a5fa;
      outline-offset: 4px;
      transform: scale(1.08);
    }

    .shortcut-icon,
    .add-btn-circle {
      width: var(--icon-size);
      height: var(--icon-size);
      border-radius: 50%;
      background-color: #000000;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: calc(9px * var(--ui-scale));
      transition: transform 0.24s cubic-bezier(0.34, 1.56, 0.64, 1), width 0.2s ease, height 0.2s ease;
    }

    .shortcut-icon {
      overflow: hidden;
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.65);
    }

    .add-btn-circle {
      border: 1.5px dashed rgba(255, 255, 255, 0.34);
      color: rgba(255, 255, 255, 0.78);
      font-size: calc(24px * var(--ui-scale));
      font-weight: 300;
    }

    .shortcut-item:active .shortcut-icon,
    .shortcut-item:active .add-btn-circle {
      transform: scale(0.9);
    }

    .shortcut-icon img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 50%;
      display: block;
      pointer-events: none;
    }

    .badge-btn {
      position: absolute;
      top: -4px;
      width: 21px;
      height: 21px;
      border-radius: 50%;
      color: #fff;
      font-size: 11px;
      display: none;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(255, 255, 255, 0.5);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
      z-index: 5;
      cursor: pointer;
    }

    .delete-badge { right: 4px; background: rgba(239, 68, 68, 0.95); }
    .edit-badge { left: 4px; background: rgba(59, 130, 246, 0.95); }
    .edit-mode .badge-btn { display: flex; }

    .edit-banner {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 10px;
      background: rgba(30, 41, 59, 0.88);
      border: 1px solid rgba(96, 165, 250, 0.4);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: calc(12.5px * var(--ui-scale));
      color: #e2e8f0;
      margin-bottom: 18px;
      backdrop-filter: blur(12px);
    }

    .edit-mode .edit-banner { display: flex; }

    .edit-done-pill {
      background: #3b82f6;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 4px 10px;
      font-size: calc(12px * var(--ui-scale));
      cursor: pointer;
    }

    .shortcut-title {
      font-size: calc(var(--shortcut-font-size) * var(--ui-scale));
      color: rgba(248, 250, 252, 0.92);
      text-align: center;
      width: 100%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.9);
    }

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.78);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal-overlay.active { display: flex; }

    .modal-card {
      width: 100%;
      max-width: 400px;
      max-height: 90dvh;
      overflow-y: auto;
      background: #121620;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: var(--glass-highlight), 0 24px 48px rgba(0, 0, 0, 0.85);
      border-radius: 20px;
      padding: 24px;
      color: var(--text-main);
    }

    .modal-card h2 {
      font-size: calc(17px * var(--ui-scale));
      margin-bottom: 18px;
      font-weight: 600;
    }

    .form-group { margin-bottom: 16px; }

    .form-group label {
      display: block;
      font-size: calc(13px * var(--ui-scale));
      color: var(--text-sub);
      margin-bottom: 8px;
    }

    .form-input,
    .select-input {
      width: 100%;
      padding: 10px 13px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      font-size: calc(13.5px * var(--ui-scale));
      outline: none;
    }

    .form-input:focus,
    .select-input:focus { border-color: #60a5fa; }

    .grid-setting-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .icon-picker-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .icon-preview {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: #000;
      border: 1px solid rgba(255, 255, 255, 0.2);
      overflow: hidden;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: calc(11px * var(--ui-scale));
      color: var(--text-sub);
    }

    .icon-preview img { width: 100%; height: 100%; object-fit: cover; }

    .icon-picker-btns { display: flex; flex: 1; gap: 8px; }

    .btn-small {
      flex: 1;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      font-size: calc(12px * var(--ui-scale));
      cursor: pointer;
    }

    .hint-text {
      font-size: calc(12px * var(--ui-scale));
      color: var(--text-sub);
      line-height: 1.55;
      margin-bottom: 18px;
    }

    .range-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .range-row input[type="range"] {
      flex: 1;
      accent-color: #60a5fa;
      cursor: pointer;
    }

    .toggle-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      margin-bottom: 14px;
    }

    .toggle-title { font-size: calc(13.5px * var(--ui-scale)); color: var(--text-main); font-weight: 500; }
    .toggle-desc { font-size: calc(11.5px * var(--ui-scale)); color: var(--text-sub); margin-top: 2px; }

    .switch-input {
      width: 44px;
      height: 24px;
      appearance: none;
      -webkit-appearance: none;
      background: rgba(148, 163, 184, 0.35);
      border-radius: 999px;
      position: relative;
      cursor: pointer;
      flex-shrink: 0;
      transition: background 0.2s ease;
    }

    .switch-input:checked { background: #3b82f6; }

    .switch-input::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #ffffff;
      transition: transform 0.2s ease;
    }

    .switch-input:checked::after { transform: translateX(20px); }

    .device-status-box {
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(0, 0, 0, 0.45);
      border: 1px solid rgba(255, 255, 255, 0.1);
      font-size: calc(12px * var(--ui-scale));
      color: #cbd5e1;
      margin-bottom: 14px;
      line-height: 1.55;
    }

    .radio-group { display: flex; flex-direction: column; gap: 10px; margin-top: 6px; }
    .radio-label { display: flex; align-items: center; gap: 8px; font-size: calc(13px * var(--ui-scale)); cursor: pointer; }

    .btn-row {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .btn {
      padding: 10px 16px;
      border-radius: 12px;
      border: none;
      font-size: calc(13.5px * var(--ui-scale));
      cursor: pointer;
      font-weight: 500;
    }

    .btn-secondary { background: rgba(255, 255, 255, 0.1); color: var(--text-main); }
    .btn-primary { background: #3b82f6; color: #fff; }

    .btn-full {
      width: 100%;
      margin-bottom: 10px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .divider-line {
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
      margin: 16px 0;
    }
  </style>
</head>
<body>
  <div class="brightness-overlay" id="brightnessOverlay" aria-hidden="true"></div>

  <div class="page-wrapper" id="pageWrapper">
    <header>
      <div class="brand-signature">Wei-Fan's homepage</div>
    </header>

    <main>
      <div class="top-profile-row">
        <div class="avatar-wrapper" id="avatarBox" title="點擊更換個人頭像">
          <img id="avatarImg" src="" alt="個人頭像" />
        </div>

        <div class="menu-wrapper" id="menuWrapper">
          <button type="button" class="hamburger-btn" id="hamburgerBtn" aria-label="開啟選單" title="功能選單">
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
            <span class="hamburger-line"></span>
          </button>
          <div class="dropdown-menu" id="dropdownMenu">
            <button type="button" class="menu-item-btn" id="settingsBtn">首頁設定</button>
            <button type="button" class="menu-item-btn" id="bgBtn">更換背景</button>
            <button type="button" class="menu-item-btn" id="brightnessBtn">亮度調整</button>
            <button type="button" class="menu-item-btn" id="pageSizeBtn">頁面尺寸</button>
            <button type="button" class="menu-item-btn" id="toggleAddShortcutBtn">新增按鈕</button>
          </div>
        </div>
      </div>

      <form class="search-box" id="searchForm">
        <span class="search-icon">⌕</span>
        <input type="text" class="search-input" id="searchInput" placeholder="搜尋 Google，或輸入關鍵字" autocomplete="off" />
        <button type="submit" class="search-submit" aria-label="搜尋">↵</button>
      </form>

      <div class="edit-banner" id="editBanner">
        <span>拖曳圖示可互換位置，或點擊圖示上方按鈕修改／刪除</span>
        <button type="button" class="edit-done-pill" id="bannerDoneBtn">完成</button>
      </div>

      <div class="shortcuts-grid" id="shortcutsGrid"></div>
    </main>
  </div>

  <input type="file" id="bgFileInput" accept="image/*" style="display: none;" />
  <input type="file" id="avatarFileInput" accept="image/*" style="display: none;" />
  <input type="file" id="shortcutIconFileInput" accept="image/*" style="display: none;" />
  <input type="file" id="importJsonFileInput" accept=".json,application/json" style="display: none;" />

  <!-- 新增 / 編輯捷徑彈窗 -->
  <div class="modal-overlay" id="addModal">
    <div class="modal-card">
      <h2 id="modalTitle">新增圓形捷徑</h2>
      <div class="form-group">
        <label>捷徑名稱</label>
        <input type="text" class="form-input" id="siteNameInput" placeholder="例如：YouTube" />
      </div>
      <div class="form-group">
        <label>網站網址</label>
        <input type="text" class="form-input" id="siteUrlInput" placeholder="例如：https://www.youtube.com" />
      </div>
      <div class="form-group">
        <label>捷徑圖示（可選，預設自動抓取網站高清圖）</label>
        <div class="icon-picker-row">
          <div class="icon-preview" id="iconPreviewBox">自動</div>
          <div class="icon-picker-btns">
            <button type="button" class="btn-small" id="pickShortcutIconBtn">選擇相簿圖片</button>
            <button type="button" class="btn-small" id="resetShortcutIconBtn">恢復自動抓取</button>
          </div>
        </div>
      </div>
      <p class="hint-text">若未自訂圖片，系統會自動抓取網站高解析度圓形圖示。</p>
      <div class="btn-row">
        <button type="button" class="btn btn-secondary" data-close-modal="addModal">取消</button>
        <button type="button" class="btn btn-primary" id="saveAddBtn">儲存捷徑</button>
      </div>
    </div>
  </div>

  <!-- 亮度調整彈窗（30% ~ 120%） -->
  <div class="modal-overlay" id="brightnessModal">
    <div class="modal-card">
      <h2>亮度調整</h2>
      <div class="form-group">
        <label>整體畫面明暗度：<span id="brightnessValueLabel">100</span>%</label>
        <div class="range-row">
          <span style="font-size:0.9em;">30%</span>

      <p class="hint-text">
        低於 100% 時會疊加柔和暗化遮罩，解決過亮桌布導致白色文字或圖示看不清楚的問題；高於 100% 則會適度提亮畫面，數值自動儲存。
      </p>
      <div class="btn-row">
        <button type="button" class="btn btn-secondary" id="resetBrightnessBtn">重設 100%</button>
        <button type="button" class="btn btn-primary" data-close-modal="brightnessModal">完成</button>
      </div>
    </div>
  </div>

  <!-- 頁面尺寸彈窗（自動適應 + 手動縮放 70% ~ 130%） -->
  <div class="modal-overlay" id="pageSizeModal">
    <div class="modal-card">
      <h2>頁面尺寸</h2>

      <div class="toggle-card">
        <div>
          <div class="toggle-title">自動適應模式</div>
          <div class="toggle-desc">依裝置寬高與橫／直向自動計算最佳容器寬度與縮放比例</div>
        </div>
        <input type="checkbox" class="switch-input" id="autoScaleToggle" checked />
      </div>

      <div class="device-status-box" id="deviceScaleInfo">偵測中...</div>

      <div class="form-group" id="manualScaleGroup">
        <label>手動比例滑桿：<span id="manualScaleLabel">100</span>%</label>
        <div class="range-row">
          <span style="font-size:0.9em;">70%</span>
          <input type="range" id="manualScaleRange" min="70" max="130" step="1" value="100" />
          <span style="font-size:0.9em;">130%</span>
        </div>
      </div>

      <p class="hint-text">
        關閉「自動適應模式」後，可針對當前裝置自由微調簽名、頭像、搜尋列與捷徑區的整體視覺大小。
      </p>

      <div class="btn-row">
        <button type="button" class="btn btn-secondary" id="resetPageSizeBtn">恢復預設</button>
        <button type="button" class="btn btn-primary" data-close-modal="pageSizeModal">完成</button>

  <!-- 首頁設定彈窗 -->
  <div class="modal-overlay" id="settingsModal">
    <div class="modal-card">
      <h2>首頁設定</h2>

      <div class="form-group">
        <label>捷徑排列行數與列數（每排欄數 × 顯示列數）</label>
        <div class="grid-setting-row">
          <select id="gridColsSelect" class="select-input">
            <option value="3">每排 3 個（3 欄）</option>
            <option value="4">每排 4 個（4 欄）</option>
            <option value="5" selected>每排 5 個（5 欄）</option>
            <option value="6">每排 6 個（6 欄）</option>
            <option value="7">每排 7 個（7 欄）</option>
            <option value="8">每排 8 個（8 欄）</option>
          </select>
          <select id="gridRowsSelect" class="select-input">
            <option value="0" selected>不限列數（自動換行）</option>
            <option value="1">最多顯示 1 列</option>
            <option value="2">最多顯示 2 列</option>
            <option value="3">最多顯示 3 列</option>
            <option value="4">最多顯示 4 列</option>
          </select>
        </div>
      </div>

      <div class="form-group">
        <label>個人頭像設定</label>
        <button type="button" class="btn btn-full" id="uploadAvatarBtn">從相簿選擇個人頭像</button>
        <div class="range-row">
          <span style="font-size:0.9em;">小</span>
          <input type="range" id="avatarSizeRange" min="64" max="140" value="100" />
          <span style="font-size:0.9em;">大</span>
        </div>
      </div>

      <div class="form-group">
        <label>所有捷徑圖示基準大小：<span id="iconSizeLabel">58</span> px</label>
        <div class="range-row">
          <span style="font-size:0.9em;">小</span>
          <input type="range" id="iconSizeRange" min="40" max="84" value="58" />
          <span style="font-size:0.9em;">大</span>
        </div>
      </div>

      <div class="form-group">
        <label>字體大小：<span id="fontSizeLabel">12</span> px</label>
        <div class="range-row">
          <span style="font-size:0.9em;">10px</span>
          <input type="range" id="fontSizeRange" min="10" max="20" step="1" value="12" />
          <span style="font-size:0.9em;">20px</span>
        </div>
      </div>

      <div class="form-group">
        <label>背景圖片顯示方式</label>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="bgFit" value="cover" checked />
            填滿畫面（建議，會依螢幕橫／直向裁切）
          </label>
          <label class="radio-label">
            <input type="radio" name="bgFit" value="contain" />
            完整顯示（可能留黑邊）
          </label>
        </div>
      </div>

      <button type="button" class="btn btn-full" id="resetBgBtn">恢復純黑極簡背景</button>

      <div class="divider-line"></div>

      <div class="form-group">
        <label>匯出 / 匯入記憶（完整備份捷徑、頭像、背景、亮度與尺寸設定）</label>
        <div class="grid-setting-row">
          <button type="button" class="btn btn-full" id="exportDataBtn" style="margin-bottom:0;">匯出設定檔</button>
          <button type="button" class="btn btn-full" id="importDataBtn" style="margin-bottom:0;">匯入設定檔</button>
        </div>
      </div>

      <div class="btn-row">
        <button type="button" class="btn btn-primary" data-close-modal="settingsModal" style="width:100%;">完成</button>
      </div>
    </div>
  </div>

  <script>
    const defaultAvatarSvg = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(
      "<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='#111622'/><circle cx='50' cy='38' r='16' fill='#64748b'/><path d='M22 84 C22 64, 78 64, 78 84' fill='#64748b'/></svg>"
    );

    const STORAGE_KEY = 'sual_shortcuts_v3_clean';
    const ALLOWED_BACKUP_KEYS = new Set([
      STORAGE_KEY,
      'sual_grid_cols',
      'sual_grid_rows',
      'sual_show_add_shortcut',
      'sual_brightness',
      'sual_auto_scale',
      'sual_manual_scale',
      'sual_icon_size',
      'sual_font_size',
      'sual_avatar_size',
      'sual_avatar',
      'sual_bg',
      'sual_bg_fit'
    ]);

    let shortcuts = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    let isEditMode = false;
    let editingIndex = -1;
    let tempCustomIcon = '';
    let dragSrcIndex = null;
    let lastLayoutSignature = '';

    let gridCols = parseInt(localStorage.getItem('sual_grid_cols')) || 5;
    let gridRows = parseInt(localStorage.getItem('sual_grid_rows')) || 0;
    let showAddShortcut = localStorage.getItem('sual_show_add_shortcut') !== 'false';
    let brightnessPercent = clampNum(parseInt(localStorage.getItem('sual_brightness')), 30, 120, 100);
    let autoScaleEnabled = localStorage.getItem('sual_auto_scale') !== 'false';
    let manualScalePercent = clampNum(parseInt(localStorage.getItem('sual_manual_scale')), 70, 130, 100);
    let globalFontSize = clampNum(parseInt(localStorage.getItem('sual_font_size')), 10, 20, 12);
    let currentScale = 1;

    const $ = (id) => document.getElementById(id);
    const grid = $('shortcutsGrid');
    const menuWrapper = $('menuWrapper');
    const pageWrapper = $('pageWrapper');
    const brightnessOverlay = $('brightnessOverlay');
    const brightnessRange = $('brightnessRange');
    const brightnessValueLabel = $('brightnessValueLabel');
    const autoScaleToggle = $('autoScaleToggle');
    const manualScaleRange = $('manualScaleRange');
    const manualScaleLabel = $('manualScaleLabel');
    const manualScaleGroup = $('manualScaleGroup');
    const deviceScaleInfo = $('deviceScaleInfo');
    const fontSizeRange = $('fontSizeRange');
    const fontSizeLabel = $('fontSizeLabel');

    function clampNum(val, min, max, fallback) {
      return Number.isFinite(val) ? Math.min(max, Math.max(min, val)) : fallback;
    }

    function applyGlobalFontSize(val) {
      const size = clampNum(parseInt(val), 10, 20, 12);
      globalFontSize = size;
      localStorage.setItem('sual_font_size', String(size));
      fontSizeRange.value = String(size);
      fontSizeLabel.textContent = String(size);
      document.documentElement.style.setProperty('--shortcut-font-size', `${size}px`);
      // 同步整體頁面文字比例（以 12px 為基準 1.0）
      document.body.style.fontSize = `calc(${(size / 12).toFixed(4)} * 14px * var(--ui-scale))`;
    }

    // 漢堡選單開關
    $('hamburgerBtn').addEventListener('click', (e) => {
      e.stopPropagation();
      menuWrapper.classList.toggle('open');
    });

    document.addEventListener('click', (e) => {
      if (!menuWrapper.contains(e.target)) {
        menuWrapper.classList.remove('open');
      }
    });

    // 統一彈窗關閉（點擊背景或 data-close-modal 按鈕）
    document.querySelectorAll('.modal-overlay').forEach((overlay) => {
      overlay.addEventListener('click', (e) => {
        if (e.target === overlay) overlay.classList.remove('active');
      });
    });

    document.querySelectorAll('[data-close-modal]').forEach((btn) => {
      btn.addEventListener('click', () => {
        $(btn.dataset.closeModal).classList.remove('active');
      });
    });

    // 1. 亮度調整（30% ~ 120%）
    function applyBrightness(val) {
      const level = clampNum(parseInt(val), 30, 120, 100);
      brightnessPercent = level;
      localStorage.setItem('sual_brightness', String(level));
      brightnessRange.value = String(level);
      brightnessValueLabel.textContent = String(level);

      if (level < 100) {
        const darkAlpha = ((100 - level) / 100) * 0.9;
        brightnessOverlay.style.backgroundColor = `rgba(0, 0, 0, ${darkAlpha.toFixed(3)})`;
        pageWrapper.style.filter = 'none';
      } else if (level > 100) {
        brightnessOverlay.style.backgroundColor = 'rgba(0, 0, 0, 0)';
        const boost = 1 + ((level - 100) / 20) * 0.2;
        pageWrapper.style.filter = `brightness(${boost.toFixed(2)})`;
      } else {
        brightnessOverlay.style.backgroundColor = 'rgba(0, 0, 0, 0)';
        pageWrapper.style.filter = 'none';
      }
    }

    // 2. 頁面尺寸（自動適應 + 手動比例 70% ~ 130%）
    function getDeviceMetrics() {
      const w = window.innerWidth;
      const h = window.innerHeight;
      const isLandscape = w >= h;
      const isTouch = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);

      let profileName = '電腦橫向';
      let baseContentWidth = 560;
      let baseWrapperWidth = 920;
      let autoScale = 1.0;

      if (!isLandscape && w < 640) {
        profileName = '手機直向';
        baseWrapperWidth = Math.min(w, 460);
        baseContentWidth = Math.min(w - 28, 430);
        autoScale = clampNum(Number((w / 390).toFixed(2)), 0.88, 1.08, 1);
      } else if (!isLandscape && w >= 640) {
        profileName = '平板直向';
        baseWrapperWidth = Math.min(w - 32, 720);
        baseContentWidth = Math.min(w - 48, 600);
        autoScale = clampNum(Number((w / 768).toFixed(2)), 0.95, 1.15, 1.04);
      } else if (isLandscape && (w <= 1024 || isTouch)) {
        profileName = '平板橫向';
        baseWrapperWidth = Math.min(w - 48, 960);
        baseContentWidth = Math.min(w - 72, 640);
        autoScale = clampNum(Number((Math.min(w / 1024, h / 720)).toFixed(2)), 0.92, 1.15, 1.03);
      } else {
        profileName = '電腦橫向';
        baseWrapperWidth = Math.min(w - 64, 1040);
        baseContentWidth = Math.min(w - 96, 620);
        autoScale = clampNum(Number((Math.min(w / 1440, h / 900)).toFixed(2)), 0.88, 1.18, 1.0);
      }

      return {
        profileName,
        orientationLabel: isLandscape ? '橫向' : '直向',
        w,
        h,
        baseWrapperWidth,
        baseContentWidth,
        autoScale
      };
    }

    function applyLayoutAndScale(forceRender = false) {
      const m = getDeviceMetrics();
      currentScale = autoScaleEnabled ? m.autoScale : (manualScalePercent / 100);

      const safeMaxViewport = m.w - 24;
      const contentWidth = Math.min(safeMaxViewport, Math.round(m.baseContentWidth * currentScale));
      const wrapperWidth = Math.min(m.w, Math.round(m.baseWrapperWidth * currentScale));

      const isPortraitPhone = !(m.w >= m.h) && m.w < 600;
      const effectiveCols = (isPortraitPhone && gridCols > 5) ? 5 : gridCols;

      const baseGridWidth = Math.max(m.baseContentWidth, Math.min(760, effectiveCols * 112));
      const gridMaxWidth = Math.min(safeMaxViewport, Math.round(baseGridWidth * currentScale));

      const baseIconSize = parseInt(localStorage.getItem('sual_icon_size')) || 58;
      const desiredIconSize = Math.round(baseIconSize * currentScale);
      const cellWidth = gridMaxWidth / effectiveCols;
      const maxAllowedIcon = Math.max(34, Math.floor(cellWidth * 0.72));
      const finalIconSize = Math.min(desiredIconSize, maxAllowedIcon);

      const gapX = effectiveCols >= 7 ? 8 : (effectiveCols >= 5 ? 14 : 20);
      const gapY = gridRows >= 3 ? 18 : 24;

      const rootStyle = document.documentElement.style;
      rootStyle.setProperty('--ui-scale', String(currentScale));
      rootStyle.setProperty('--wrapper-max-width', `${wrapperWidth}px`);
      rootStyle.setProperty('--content-max-width', `${contentWidth}px`);
      rootStyle.setProperty('--grid-max-width', `${gridMaxWidth}px`);
      rootStyle.setProperty('--grid-cols', String(effectiveCols));
      rootStyle.setProperty('--grid-gap-x', `${gapX}px`);
      rootStyle.setProperty('--grid-gap-y', `${gapY}px`);
      rootStyle.setProperty('--icon-size', `${finalIconSize}px`);
      document.body.style.fontSize = `calc(${(globalFontSize / 12).toFixed(4)} * 14px * var(--ui-scale))`;

      autoScaleToggle.checked = autoScaleEnabled;
      manualScaleRange.value = String(manualScalePercent);
      manualScaleLabel.textContent = String(manualScalePercent);
      manualScaleRange.disabled = autoScaleEnabled;
      manualScaleGroup.style.opacity = autoScaleEnabled ? '0.48' : '1';

      deviceScaleInfo.innerHTML =
        `目前模式：<strong>${autoScaleEnabled ? '自動適應' : '手動縮放'}</strong>（${Math.round(currentScale * 100)}%）<br>` +
        `裝置偵測：${m.profileName}・${m.orientationLabel}（${m.w} × ${m.h} px）`;

      const signature = `${effectiveCols}-${gridRows}-${showAddShortcut}`;
      if (forceRender || signature !== lastLayoutSignature) {
        lastLayoutSignature = signature;
        renderShortcuts();
      }
    }

    window.addEventListener('resize', () => applyLayoutAndScale(false));
    window.addEventListener('orientationchange', () => {
      setTimeout(() => applyLayoutAndScale(false), 120);
    });

    function getHighResIcon(url) {
      try {
        const domain = new URL(url).hostname;
        return `https://icon.horse/icon/${domain}`;
      } catch (e) {
        return '';
      }
    }

    function swapShortcuts(fromIndex, toIndex) {
      if (fromIndex === null || toIndex === null || fromIndex === toIndex) return;
      if (fromIndex < 0 || toIndex < 0 || fromIndex >= shortcuts.length || toIndex >= shortcuts.length) return;
      const [moved] = shortcuts.splice(fromIndex, 1);
      shortcuts.splice(toIndex, 0, moved);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(shortcuts));
      renderShortcuts();
    }

    function setEditMode(state) {
      if (isEditMode === state) return;
      isEditMode = state;
      document.body.classList.toggle('edit-mode', isEditMode);
      renderShortcuts();
    }

    function renderShortcuts() {
      grid.innerHTML = '';

      const effectiveCols = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--grid-cols')) || gridCols;
      const maxSlots = gridRows > 0 ? (effectiveCols * gridRows) : Infinity;
      const reserveAddSlot = (showAddShortcut && maxSlots < Infinity) ? 1 : 0;
      const visibleShortcuts = maxSlots < Infinity
        ? shortcuts.slice(0, Math.max(0, maxSlots - reserveAddSlot))
        : shortcuts;

      visibleShortcuts.forEach((item, index) => {
        const a = document.createElement('a');
        a.className = 'shortcut-item';
        a.href = isEditMode ? 'javascript:void(0)' : item.url;
        a.dataset.index = String(index);
        a.dataset.draggable = 'true';
        if (isEditMode) a.setAttribute('draggable', 'true');

        let domain = '';
        try { domain = new URL(item.url).hostname; } catch (e) {}
        const fallbackUrl = `https://www.google.com/s2/favicons?domain=${domain}&sz=256`;
        const iconSrc = item.customIcon || getHighResIcon(item.url);

        a.innerHTML = `
          <button type="button" class="badge-btn edit-badge" title="編輯">✎</button>
          <button type="button" class="badge-btn delete-badge" title="刪除">✕</button>
          <div class="shortcut-icon">
            <img src="${iconSrc}" alt="${item.name}" />
          </div>
          <span class="shortcut-title">${item.name}</span>
        `;

        const imgEl = a.querySelector('img');
        imgEl.onerror = () => {
          imgEl.onerror = null;
          imgEl.src = fallbackUrl;
        };

        a.querySelector('.delete-badge').addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          shortcuts.splice(index, 1);
          localStorage.setItem(STORAGE_KEY, JSON.stringify(shortcuts));
          renderShortcuts();
        });

        a.querySelector('.edit-badge').addEventListener('click', (e) => {
          e.preventDefault();
          e.stopPropagation();
          openShortcutModal(index);
        });

        let pressTimer = null;
        let startX = 0;
        let startY = 0;
        let suppressClick = false;
        let isTouchDragging = false;

        const clearPress = () => {
          if (pressTimer) {
            clearTimeout(pressTimer);
            pressTimer = null;
          }
        };

        a.addEventListener('mousedown', (e) => {
          if (e.button !== 0 || isEditMode || e.target.closest('.badge-btn')) return;
          startX = e.clientX;
          startY = e.clientY;
          suppressClick = false;
          pressTimer = setTimeout(() => {
            suppressClick = true;
            setEditMode(true);
          }, 420);
        });

        a.addEventListener('mousemove', (e) => {
          if (pressTimer && (Math.abs(e.clientX - startX) > 8 || Math.abs(e.clientY - startY) > 8)) {
            clearPress();
          }
        });

        a.addEventListener('mouseup', clearPress);
        a.addEventListener('mouseleave', clearPress);

        a.addEventListener('dragstart', (e) => {
          if (!isEditMode) return e.preventDefault();
          dragSrcIndex = index;
          a.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
        });

        a.addEventListener('dragover', (e) => {
          if (!isEditMode) return;
          e.preventDefault();
          a.classList.add('drag-over');
        });

        a.addEventListener('dragleave', () => a.classList.remove('drag-over'));

        a.addEventListener('drop', (e) => {
          if (!isEditMode) return;
          e.preventDefault();
          a.classList.remove('drag-over');
          const src = dragSrcIndex;
          dragSrcIndex = null;
          swapShortcuts(src, index);
        });

        a.addEventListener('dragend', () => {
          a.classList.remove('dragging');
          document.querySelectorAll('.shortcut-item').forEach((el) => el.classList.remove('drag-over'));
        });

        a.addEventListener('touchstart', (e) => {
          if (e.target.closest('.badge-btn')) return;
          const touch = e.touches[0];
          startX = touch.clientX;
          startY = touch.clientY;
          suppressClick = false;

          if (isEditMode) {
            isTouchDragging = true;
            a.classList.add('dragging');
          } else {
            isTouchDragging = false;
            pressTimer = setTimeout(() => {
              suppressClick = true;
              if (navigator.vibrate) navigator.vibrate(25);
              setEditMode(true);
            }, 400);
          }
        }, { passive: true });

        a.addEventListener('touchmove', (e) => {
          const touch = e.touches[0];
          if (!isEditMode) {
            if (Math.abs(touch.clientX - startX) > 10 || Math.abs(touch.clientY - startY) > 10) {
              clearPress();
            }
            return;
          }
          if (!isTouchDragging) return;
          e.preventDefault();
          const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
          const targetItem = targetEl ? targetEl.closest('.shortcut-item[data-draggable="true"]') : null;
          document.querySelectorAll('.shortcut-item').forEach((el) => el.classList.remove('drag-over'));
          if (targetItem && parseInt(targetItem.dataset.index) !== index) {
            targetItem.classList.add('drag-over');
          }
        }, { passive: false });

        a.addEventListener('touchend', (e) => {
          clearPress();
          if (!isTouchDragging) return;
          isTouchDragging = false;
          const touch = e.changedTouches[0];
          const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
          const targetItem = targetEl ? targetEl.closest('.shortcut-item[data-draggable="true"]') : null;
          a.classList.remove('dragging');
          document.querySelectorAll('.shortcut-item').forEach((el) => el.classList.remove('drag-over'));
          if (targetItem) {
            swapShortcuts(index, parseInt(targetItem.dataset.index));
          }
        });

        a.addEventListener('touchcancel', () => {
          clearPress();
          isTouchDragging = false;
          a.classList.remove('dragging');
          document.querySelectorAll('.shortcut-item').forEach((el) => el.classList.remove('drag-over'));
        });

        a.addEventListener('contextmenu', (e) => e.preventDefault());

        a.addEventListener('click', (e) => {
          if (suppressClick || isEditMode) {
            e.preventDefault();
            suppressClick = false;
          }
        });

        grid.appendChild(a);
      });

      if (showAddShortcut) {
        const addBtn = document.createElement('div');
        addBtn.className = 'shortcut-item';
        addBtn.innerHTML = `
          <div class="add-btn-circle">+</div>
          <span class="shortcut-title">新增捷徑</span>
        `;
        addBtn.addEventListener('click', () => openShortcutModal(-1));
        grid.appendChild(addBtn);
      }
    }

    function updateIconPreview(src) {
      $('iconPreviewBox').innerHTML = src ? `<img src="${src}" alt="預覽" />` : '自動';
    }

    function openShortcutModal(index) {
      editingIndex = index;
      const isEdit = index >= 0;
      $('modalTitle').textContent = isEdit ? '編輯捷徑' : '新增圓形捷徑';
      $('siteNameInput').value = isEdit ? shortcuts[index].name : '';
      $('siteUrlInput').value = isEdit ? shortcuts[index].url : '';
      tempCustomIcon = isEdit ? (shortcuts[index].customIcon || '') : '';
      updateIconPreview(tempCustomIcon);
      $('addModal').classList.add('active');
    }

    $('pickShortcutIconBtn').addEventListener('click', () => $('shortcutIconFileInput').click());
    $('resetShortcutIconBtn').addEventListener('click', () => {
      tempCustomIcon = '';
      updateIconPreview('');
    });

    $('shortcutIconFileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      compressImage(file, 256, 0.9, true, (dataUrl) => {
        tempCustomIcon = dataUrl;
        updateIconPreview(dataUrl);
      });
      e.target.value = '';
    });

    // 搜尋列提交（嚴謹網址判斷，避免一般關鍵字誤跳轉）
    $('searchForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const q = $('searchInput').value.trim();
      if (!q) return;
      if (/^https?:\/\/\S+/i.test(q)) {
        window.location.href = q;
      } else if (!/\s/.test(q) && /^(www\.)?[a-zA-Z0-9-]+(\.[a-zA-Z0-9-]+)*\.(com|org|net|edu|gov|io|tw|jp|kr|co|me|app|dev|ai|tv|cc|info|biz)(\/.*)?$/i.test(q)) {
        window.location.href = 'https://' + q;
      } else {
        window.location.href = `https://www.google.com/search?q=${encodeURIComponent(q)}`;
      }
    });

    $('bannerDoneBtn').addEventListener('click', () => setEditMode(false));

    function updateAddShortcutToggleLabel() {
      $('toggleAddShortcutBtn').textContent = showAddShortcut ? '新增按鈕（顯示中）' : '新增按鈕（已隱藏）';
    }

    $('toggleAddShortcutBtn').addEventListener('click', () => {
      showAddShortcut = !showAddShortcut;
      localStorage.setItem('sual_show_add_shortcut', String(showAddShortcut));
      updateAddShortcutToggleLabel();
      menuWrapper.classList.remove('open');
      renderShortcuts();
    });

    // 亮度調整選單與事件
    $('brightnessBtn').addEventListener('click', () => {
      menuWrapper.classList.remove('open');
      brightnessRange.value = String(brightnessPercent);
      brightnessValueLabel.textContent = String(brightnessPercent);
      $('brightnessModal').classList.add('active');
    });

    brightnessRange.addEventListener('input', (e) => applyBrightness(e.target.value));
    $('resetBrightnessBtn').addEventListener('click', () => applyBrightness(100));

    // 頁面尺寸選單與事件
    $('pageSizeBtn').addEventListener('click', () => {
      menuWrapper.classList.remove('open');
      applyLayoutAndScale(false);
      $('pageSizeModal').classList.add('active');
    });

    autoScaleToggle.addEventListener('change', (e) => {
      autoScaleEnabled = e.target.checked;
      localStorage.setItem('sual_auto_scale', String(autoScaleEnabled));
      applyLayoutAndScale(false);
    });

    manualScaleRange.addEventListener('input', (e) => {
      manualScalePercent = clampNum(parseInt(e.target.value), 70, 130, 100);
      localStorage.setItem('sual_manual_scale', String(manualScalePercent));
      if (!autoScaleEnabled) {
        applyLayoutAndScale(false);
      } else {
        manualScaleLabel.textContent = String(manualScalePercent);
      }
    });

    $('resetPageSizeBtn').addEventListener('click', () => {
      autoScaleEnabled = true;
      manualScalePercent = 100;
      localStorage.setItem('sual_auto_scale', 'true');
      localStorage.setItem('sual_manual_scale', '100');
      applyLayoutAndScale(false);
    });

    $('saveAddBtn').addEventListener('click', () => {
      const name = $('siteNameInput').value.trim();
      let url = $('siteUrlInput').value.trim();
      if (!name || !url) return alert('請輸入名稱與網址');
      if (!/^https?:\/\//i.test(url)) url = 'https://' + url;

      const dataObj = { name, url, customIcon: tempCustomIcon };
      if (editingIndex >= 0) {
        shortcuts[editingIndex] = dataObj;
      } else {
        shortcuts.push(dataObj);
      }

      localStorage.setItem(STORAGE_KEY, JSON.stringify(shortcuts));
      $('addModal').classList.remove('active');
      renderShortcuts();
    });

    function compressImage(file, maxWidth, quality, keepPng, callback) {
      const reader = new FileReader();
      reader.onload = (ev) => {
        const img = new Image();
        img.onload = () => {
          const canvas = document.createElement('canvas');
          let { width, height } = img;
          if (width > maxWidth) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          }
          canvas.width = width;
          canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          const mime = (keepPng && file.type === 'image/png') ? 'image/png' : 'image/jpeg';
          callback(canvas.toDataURL(mime, quality));
        };
        img.src = ev.target.result;
      };
      reader.readAsDataURL(file);
    }

    const triggerAvatarUpload = () => $('avatarFileInput').click();
    $('avatarBox').addEventListener('click', triggerAvatarUpload);
    $('uploadAvatarBtn').addEventListener('click', triggerAvatarUpload);

    $('avatarFileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      compressImage(file, 400, 0.88, false, (dataUrl) => {
        $('avatarImg').src = dataUrl;
        localStorage.setItem('sual_avatar', dataUrl);
      });
      e.target.value = '';
    });

    $('bgBtn').addEventListener('click', () => {
      menuWrapper.classList.remove('open');
      $('bgFileInput').click();
    });

    $('bgFileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      compressImage(file, 1600, 0.85, false, (dataUrl) => {
        document.body.style.backgroundImage = `url('${dataUrl}')`;
        try {
          localStorage.setItem('sual_bg', dataUrl);
        } catch (err) {
          alert('圖片檔案過大，已為您暫時套用，但重開瀏覽器可能不會保留。');
        }
      });
      e.target.value = '';
    });

    $('settingsBtn').addEventListener('click', () => {
      menuWrapper.classList.remove('open');
      $('settingsModal').classList.add('active');
    });

    // JSON 完整備份匯出與白名單匯入
    $('exportDataBtn').addEventListener('click', () => {
      const backupObj = {};
      ALLOWED_BACKUP_KEYS.forEach((key) => {
        const val = localStorage.getItem(key);
        if (val !== null) backupObj[key] = val;
      });
      const jsonStr = JSON.stringify(backupObj, null, 2);
      const dateStr = new Date().toISOString().slice(0, 10);
      const filename = `homepage_backup_${dateStr}.json`;

      try {
        const blob = new Blob([jsonStr], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      } catch (err) {
        const dataUri = 'data:application/json;charset=utf-8,' + encodeURIComponent(jsonStr);
        window.open(dataUri, '_blank');
      }
    });

    $('importDataBtn').addEventListener('click', () => $('importJsonFileInput').click());

    $('importJsonFileInput').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const data = JSON.parse(ev.target.result);
          if (typeof data !== 'object' || data === null) throw new Error('格式錯誤');
          let restoredCount = 0;
          Object.keys(data).forEach((k) => {
            if (ALLOWED_BACKUP_KEYS.has(k) && typeof data[k] === 'string') {
              localStorage.setItem(k, data[k]);
              restoredCount++;
            }
          });
          if (restoredCount === 0) throw new Error('無有效設定');
          alert('記憶匯入成功，即將重新載入首頁！');
          location.reload();
        } catch (err) {
          alert('匯入失敗：檔案格式不正確或不含首頁設定。');
        }
      };
      reader.readAsText(file);
      e.target.value = '';
    });

    $('gridColsSelect').addEventListener('change', (e) => {
      gridCols = parseInt(e.target.value);
      localStorage.setItem('sual_grid_cols', String(gridCols));
      applyLayoutAndScale(true);
    });

    $('gridRowsSelect').addEventListener('change', (e) => {
      gridRows = parseInt(e.target.value);
      localStorage.setItem('sual_grid_rows', String(gridRows));
      applyLayoutAndScale(true);
    });

    $('iconSizeRange').addEventListener('input', (e) => {
      const val = e.target.value;
      $('iconSizeLabel').textContent = val;
      localStorage.setItem('sual_icon_size', val);
      applyLayoutAndScale(false);
    });

    fontSizeRange.addEventListener('input', (e) => {
      applyGlobalFontSize(e.target.value);
    });

    $('avatarSizeRange').addEventListener('input', (e) => {
      const val = e.target.value;
      document.documentElement.style.setProperty('--avatar-size', `${val}px`);
      localStorage.setItem('sual_avatar_size', val);
    });

    document.querySelectorAll('input[name="bgFit"]').forEach((radio) => {
      radio.addEventListener('change', (e) => {
        document.body.style.backgroundSize = e.target.value;
        localStorage.setItem('sual_bg_fit', e.target.value);
      });
    });

    $('resetBgBtn').addEventListener('click', () => {
      localStorage.removeItem('sual_bg');
      document.body.style.backgroundImage = 'none';
      document.body.style.backgroundColor = '#000000';
    });

    function initSettings() {
      $('avatarImg').src = localStorage.getItem('sual_avatar') || defaultAvatarSvg;

      const savedBg = localStorage.getItem('sual_bg');
      if (savedBg) {
        document.body.style.backgroundImage = `url('${savedBg}')`;
      } else {
        document.body.style.backgroundImage = 'none';
        document.body.style.backgroundColor = '#000000';
      }

      const savedIconSize = localStorage.getItem('sual_icon_size');
      if (savedIconSize) {
        $('iconSizeRange').value = savedIconSize;
        $('iconSizeLabel').textContent = savedIconSize;
      }

      const savedAvatarSize = localStorage.getItem('sual_avatar_size');
      if (savedAvatarSize) {
        $('avatarSizeRange').value = savedAvatarSize;
        document.documentElement.style.setProperty('--avatar-size', `${savedAvatarSize}px`);
      }

      const savedBgFit = localStorage.getItem('sual_bg_fit');
      if (savedBgFit) {
        document.body.style.backgroundSize = savedBgFit;
        const radio = document.querySelector(`input[name="bgFit"][value="${savedBgFit}"]`);
        if (radio) radio.checked = true;
      }

      $('gridColsSelect').value = String(gridCols);
      $('gridRowsSelect').value = String(gridRows);
      updateAddShortcutToggleLabel();

      applyGlobalFontSize(globalFontSize);
      applyBrightness(brightnessPercent);
      applyLayoutAndScale(true);
    }

    initSettings();
  </script>
</body>
</html>
